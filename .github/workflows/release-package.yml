name: Release package

# On a version tag: build the marketplace ZIP and attach it to the GitHub Release.
# Agensi has no documented upload API, so the final upload there stays manual:
# download the ZIP from the release and submit it in the Agensi dashboard.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != plugin.json $v"; exit 1; }
      - name: Build the ZIP
        run: tools/package-agensi
      - name: Extract release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/agensi/youtrack-task.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
