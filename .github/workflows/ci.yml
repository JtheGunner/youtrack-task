name: CI

# Runs on every pull request and on pushes to main. The release workflow calls
# it too, so a tag can only be released when these checks pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the test suites
        run: |
          for t in tests/*.sh; do
            echo "== $t"
            bash "$t"
          done
      - name: ShellCheck hooks and scripts
        run: |
          find hooks skills/youtrack-task/scripts -type f ! -name '*.json' ! -name '*.md' -print0 \
            | xargs -0 shellcheck -S warning
      - name: Validate JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './.worktrees/*' -print0 \
            | xargs -0 -n1 sh -c 'echo "jq empty $0"; jq empty "$0"'
      - name: Check plugin.json and marketplace.json versions match
        run: |
          p=$(jq -r .version .claude-plugin/plugin.json)
          m=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          [ "$p" = "$m" ] || { echo "plugin.json $p != marketplace.json $m"; exit 1; }
