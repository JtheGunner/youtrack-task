# youtrack-task — optional configuration
#
# Copy to  ~/.config/youtrack-task/config.toml  and uncomment what you want to
# override. Every key is optional; the defaults below are what the skill uses if
# this file is absent.
#
# The YouTrack URL and API token are NOT configured here — they are environment
# variables (YOUTRACK_MCP_URL, YOUTRACK_TOKEN) read by the bundled MCP server.

# Query used to list candidate issues when you run `/youtrack-task` with no ID.
# YouTrack search syntax.
# list_query = "for: me #Unresolved State: {In Progress}, {Open} sort by: updated desc"

# State names on your workflow's ladder: Open -> In Progress -> Testing -> Done.
# in_progress_state = "In Progress"   # set on pickup
# testing_state     = "Testing"       # target of `/youtrack-task testing`
# done_state        = "Done"          # target of `/youtrack-task done`

# Local copy of the plan:
#   auto   -> write docs/plans/<ID>.md only if the repo already has a docs/ dir
#   always -> always write it (creating docs/plans/ if needed)
#   never  -> never write a local file; plan lives only as a YouTrack comment
# local_plan_copy = "auto"

# Fallback issue Type for `/youtrack-task new` when it can't confidently infer one
# from the title + description. Unset -> the skill just asks you to pick.
# default_new_type = "Task"

# Run planning + implementation through the `superpowers` plugin when it's present.
#   auto   -> use it if its skills are available, else plain plan mode
#   always -> require it; stop with a hint to install it if missing
#   never  -> always plain plan mode + normal dev workflow
# use_superpowers = "auto"

# Review gate (reference/review.md): an independent `ticket-reviewer` subagent
# reviews every task with commits before it can be pushed or opened as a PR.
#   always -> review every task (default; "auto" is accepted as a synonym)
#   never  -> standing opt-out; `pr` then labels the PR "Review: skipped"
# review_before_pr = "always"
# review_rounds    = 2   # max fix / re-review rounds per issue (alias: batch_review_rounds)

# Isolate each pickup in its own git worktree (for working several tasks in
# parallel). See reference/worktrees.md.
#   auto   -> worktree when the checkout is dirty, on a non-default branch, or a
#             plugin worktree already exists (first pickup in a clean repo stays
#             in place -> use "always" for genuinely parallel work)
#   off    -> always switch the current checkout in place
#   always -> every pickup gets a worktree
# worktree = "auto"
# worktree_dir = ".worktrees"                 # dir under the repo root, must be gitignored
# worktree_clone = ["node_modules", "vendor"] # CoW-copied into a new worktree (isolated)
# worktree_link  = [".env"]                   # symlinked from the main checkout (shared)
# A repo may also provide .claude/youtrack-worktree-setup.sh (run after creation,
# env: WORKTREE_PATH, MAIN_PATH, BRANCH, ISSUE_ID) for project-specific bootstrap.

# Batch mode: `/youtrack-task all`. See reference/batch.md.
# batch_query         = "for: me #Unresolved State: Open sort by: updated desc"  # candidates when no IDs are given
# batch_max_parallel  = 3          # parallel workers
# batch_skip_tags     = ["manual"] # issues with these tags are never run unattended
# batch_review_rounds = 2          # deprecated alias of review_rounds

# Branch prefix per YouTrack issue Type. Keys are Type names exactly as YouTrack
# reports them (case-sensitive). Unlisted types fall back to "chore".
# [type_prefix]
# Bug       = "fix"
# Feature   = "feat"
# Task      = "chore"
# Epic      = "feat"
# Cosmetics = "style"
