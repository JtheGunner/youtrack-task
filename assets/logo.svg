<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">youtrack-task logo</title>
  <defs>
    <linearGradient id="pink-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2f7d"/>
      <stop offset="1" stop-color="#e8135f"/>
    </linearGradient>
    <linearGradient id="pink-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fbb"/>
      <stop offset="1" stop-color="#ff5d9c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a98"/>
      <stop offset="1" stop-color="#52525e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9b9c4"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="118" y="110" width="290" height="290" rx="6"/>
    </clipPath>
  </defs>

  <!-- Pink shapes behind the tile -->
  <g transform="rotate(-24 200 250)">
    <rect x="62" y="84" width="270" height="330" rx="64" fill="url(#pink-main)" stroke="#8c2a52" stroke-width="3"/>
  </g>
  <g transform="rotate(8 420 250)">
    <rect x="352" y="146" width="116" height="190" rx="6" fill="url(#pink-light)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Dark metallic tile -->
  <g clip-path="url(#tile-clip)">
    <rect x="118" y="110" width="290" height="290" fill="url(#tile)"/>
    <polygon points="338,110 408,110 408,400 232,400" fill="url(#sheen)" opacity="0.85"/>
  </g>
  <rect x="118" y="110" width="290" height="290" rx="6" fill="none" stroke="url(#edge)" stroke-width="4"/>

  <!-- Branch symbol with check badge -->
  <g transform="translate(127.5 126.5) scale(0.5)">
    <line x1="168" y1="122" x2="168" y2="392" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <circle cx="168" cy="122" r="34" fill="#ffffff"/>
    <circle cx="168" cy="392" r="34" fill="#ffffff"/>
    <path d="M168 300 C168 240 220 252 300 238" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    <circle cx="342" cy="196" r="64" fill="#ffffff"/>
    <circle cx="342" cy="196" r="52" fill="#22c55e"/>
    <path d="M318 198 L336 216 L368 178" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
